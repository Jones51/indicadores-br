version: 2

models:
  - name: fct_indicadores_mensais
    description: >
      Indicadores macroeconômicos consolidados por mês. Um mês entra assim que qualquer
      série tiver observação nele, então o mês corrente aparece com Selic e dólar antes
      da divulgação do IPCA (que sai com ~1 mês de defasagem); colunas de séries ainda
      sem dado no mês ficam nulas.
    columns:
      - name: mes_referencia
        description: Primeiro dia do mês de referência.
        data_tests: [unique, not_null]
      - name: selic_meta_aa
        description: Meta Selic vigente no último dia com dado do mês (% a.a.). Nulo se não houver observação da Selic no mês.
      - name: ipca_mensal
        description: Variação mensal do IPCA (%). Nulo enquanto o IPCA do mês não for divulgado (normalmente o mês corrente).
      - name: ipca_12m
        description: IPCA acumulado em 12 meses (%). Nulo enquanto o IPCA do mês não for divulgado (normalmente o mês corrente).
      - name: juro_real_ex_post_aa
        description: Selic meta descontada do IPCA 12m pela equação de Fisher (% a.a.). Nulo se faltar a Selic ou o IPCA 12m do mês.
      - name: dolar_ptax_medio
        description: Média mensal da PTAX venda (R$/US$), até o último dia com dado no mês. Nulo se não houver cotação no mês.
      - name: dolar_ptax_fim_mes
        description: PTAX venda do último dia útil com dado no mês (R$/US$); no mês corrente, a cotação mais recente. Nulo se não houver cotação no mês.
      - name: meta_inflacao
        description: >
          Centro da meta para a inflação (%) vigente no ano do mês, do seed `metas_inflacao` (CMN).
          Desde 2025 é a meta contínua, que segue valendo até o CMN fixar outra (ADR 0007).
          Preenchida mesmo no mês corrente, sem IPCA. Nula só para meses anteriores ao seed
          (antes de 2010), o que o teste `not_null` acusa.
        data_tests: [not_null]
      - name: meta_inflacao_inferior
        description: Piso do intervalo de tolerância da meta (%) = meta − tolerância.
        data_tests: [not_null]
      - name: meta_inflacao_superior
        description: Teto do intervalo de tolerância da meta (%) = meta + tolerância.
        data_tests: [not_null]
      - name: status_meta_inflacao
        description: >
          Posição do IPCA 12m em relação à banda da meta do ano: `acima` (maior que o teto),
          `dentro` (entre piso e teto, limites inclusivos) ou `abaixo` (menor que o piso). Nulo
          enquanto o IPCA do mês não for divulgado. Até 2024 a meta formal era sobre o IPCA de
          dezembro; nos outros meses o status é uma referência analítica, não descumprimento.
        data_tests:
          - accepted_values:
              arguments:
                values: [acima, dentro, abaixo]
      - name: meses_seguidos_status_meta
        description: >
          Quantos meses seguidos, terminando neste, o IPCA 12m está com o mesmo
          `status_meta_inflacao` (1 = o status mudou neste mês). Na meta contínua (desde 2025),
          6 meses seguidos fora da banda caracterizam descumprimento. Nulo quando o status é nulo.

  - name: fct_decisoes_copom
    description: >
      Uma linha por mudança da meta Selic, derivada da série diária SGS 432. A data é a da
      **vigência** na série (primeiro dia com a meta nova), que costuma ser o dia útil seguinte à
      reunião do Copom: não é a data da reunião. Manutenções da taxa não aparecem (a série não
      muda). Só cobre o período ingerido (desde 2010): a primeira observação não tem anterior e
      não conta como decisão (ADR 0008).
    columns:
      - name: data_vigencia
        description: Primeiro dia em que a SGS 432 mostra a nova meta Selic (chave).
        data_tests: [unique, not_null]
      - name: selic_anterior_aa
        description: Meta Selic vigente antes da mudança (% a.a.).
        data_tests: [not_null]
      - name: selic_nova_aa
        description: Meta Selic a partir de `data_vigencia` (% a.a.).
        data_tests: [not_null]
      - name: variacao_bp
        description: Variação da meta em pontos-base (selic_nova − selic_anterior, × 100); positivo = alta, negativo = corte. Nunca zero.
        data_tests: [not_null]
