name: indicadores_br
version: "0.1.0"
config-version: 2
profile: indicadores_br

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  indicadores_br:
    # Análise estática estrita: o SQL dos modelos é validado (tipos e colunas) já na compilação.
    +static_analysis: strict
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

# Tabelas de referência mantidas à mão (ex.: metas de inflação do CMN, ADR 0007).
# O `dbt build` carrega os seeds antes dos modelos que dependem deles.
seeds:
  indicadores_br:
    +schema: seeds
